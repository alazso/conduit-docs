name: Build & Push Docs Image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
# GitHub deprecated Node 20 on runners. checkout is bumped to a Node 24 native
# major; this env var forces the docker/* JS actions onto Node 24 until Docker
# ships Node 24 native releases, which silences the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/alazso/conduit-docs:latest
